[workspace]
members = ["crates/vision-core", "crates/vision-server", "src-tauri"]
default-members = ["crates/vision-core", "crates/vision-server"]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2024"
rust-version = "1.96"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4", "serde"] }
csv = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
